name: Dependencias de tickets

# Mantiene las etiquetas "bloqueado" / "listo" según las relaciones nativas
# "Blocked by" de GitHub. Si existe el secreto PROJECT_TOKEN, también mueve el
# campo Status del Project entre "Bloqueado" y "Listo".

on:
  issues:
    types: [opened, closed, reopened]
  schedule:
    - cron: "*/30 * * * *"   # red de seguridad: relaciones agregadas a mano en la UI
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: dependencias
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const BLOCKED = 'bloqueado';
            const READY = 'listo';

            // ---------- Project (opcional) ----------
            const projectNumber = parseInt(process.env.PROJECT_NUMBER || '0', 10);
            const pgql = process.env.PROJECT_TOKEN && projectNumber
              ? getOctokit(process.env.PROJECT_TOKEN).graphql : null;
            let projectMeta = null;
            async function loadProject() {
              if (!pgql || projectMeta) return projectMeta;
              const r = await pgql(`query($login:String!,$n:Int!){ user(login:$login){ projectV2(number:$n){ id
                  field(name:"Status"){ ... on ProjectV2SingleSelectField { id options { id name } } } } } }`,
                { login: owner, n: projectNumber });
              const p = r.user.projectV2;
              projectMeta = { id: p.id, fieldId: p.field.id,
                opt: Object.fromEntries(p.field.options.map(o => [o.name, o.id])) };
              return projectMeta;
            }
            async function setProjectStatus(issueNumber, blocked) {
              const meta = await loadProject();
              if (!meta) return;
              const r = await pgql(`query($o:String!,$r:String!,$n:Int!){ repository(owner:$o,name:$r){ issue(number:$n){
                  projectItems(first:20){ nodes { id project { id }
                    fieldValueByName(name:"Status"){ ... on ProjectV2ItemFieldSingleSelectValue { name } } } } } } }`,
                { o: owner, r: repo, n: issueNumber });
              const item = r.repository.issue.projectItems.nodes.find(i => i.project.id === meta.id);
              if (!item) return;
              const current = item.fieldValueByName?.name ?? null;
              // Solo mueve entre Bloqueado y Listo; nunca pisa "En progreso", "En revisión" o "Hecho".
              let target = null;
              if (blocked && (current === null || current === 'Listo')) target = 'Bloqueado';
              if (!blocked && (current === null || current === 'Bloqueado')) target = 'Listo';
              if (!target || !meta.opt[target]) return;
              await pgql(`mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){ updateProjectV2ItemFieldValue(input:{
                  projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){ clientMutationId } }`,
                { p: meta.id, i: item.id, f: meta.fieldId, o: meta.opt[target] });
            }

            // ---------- Dependencias nativas ----------
            async function deps(n, kind) {   // kind: blocked_by | blocking
              return await github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/' + kind,
                { owner, repo, issue_number: n, per_page: 100 });
            }

            async function refresh(n) {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: n });
              if (issue.pull_request) return;
              const labels = issue.labels.map(l => typeof l === 'string' ? l : l.name);
              const has = name => labels.includes(name);
              const add = async name => { if (!has(name)) await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: [name] }); };
              const remove = async name => { if (has(name)) await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name }).catch(() => {}); };

              if (issue.state === 'closed') { await remove(BLOCKED); await remove(READY); return; }

              const open = (await deps(n, 'blocked_by')).filter(b => b.state === 'open');
              if (open.length) {
                await add(BLOCKED); await remove(READY);
                await setProjectStatus(n, true);
                core.info(`#${n} bloqueado por ${open.map(b => '#' + b.number).join(', ')}`);
              } else {
                const wasBlocked = has(BLOCKED);
                await remove(BLOCKED); await add(READY);
                await setProjectStatus(n, false);
                if (wasBlocked) {
                  const who = issue.assignees.map(a => '@' + a.login).join(' ') || 'El equipo';
                  await github.rest.issues.createComment({ owner, repo, issue_number: n,
                    body: `🔓 **Desbloqueado.** Todas sus dependencias están cerradas. ${who} ya puede empezar.` });
                }
                core.info(`#${n} listo`);
              }
            }

            if (context.eventName === 'issues') {
              const n = context.payload.issue.number;
              await refresh(n);
              if (['closed', 'reopened'].includes(context.payload.action)) {
                for (const d of await deps(n, 'blocking')) await refresh(d.number);
              }
            } else {
              const all = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
              for (const i of all) if (!i.pull_request) await refresh(i.number);
            }
